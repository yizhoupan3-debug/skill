[package]
name = "research-harness"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "L5 unified research harness: paper revision loop, literature search, claims management, AIGC detection, verification, research logging, and CLI tools — 实际依赖 L5 host-projection，从 L3 升级"

[features]
default = ["cli"]
cli = ["dep:clap"]
smoke = []

[dependencies]
# framework (leaf crates, no cycle risk)
core-state-utils = { path = "../core-state-utils" }
core-policy = { path = "../core-policy" }
core-state = { path = "../core-state" }
framework-kernel = { path = "../framework-kernel" }
host-projection = { path = "../host-projection" }
fr-utils = { path = "../fr-utils" }

# LaTeX (RaTeX)
ratex-lexer = "0.1.11"
ratex-font = "0.1.11"
unicode-normalization = "0.1"
fancy-regex = "0.14"
thiserror = "2"
regex-lite = "0.1"

# common
anyhow.workspace = true
chrono.workspace = true
html-escape = "0.2"
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yml.workspace = true
tracing.workspace = true
regex.workspace = true
sha2.workspace = true

# CLI (optional)
clap = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "autoresearch"
path = "src/bin/autoresearch.rs"
required-features = ["cli"]

[[bin]]
name = "research-log"
path = "src/bin/research-log.rs"
required-features = ["cli"]

[lints]
workspace = true
