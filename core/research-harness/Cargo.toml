[package]
name = "research-harness"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "L5 unified research harness: paper revision loop, literature search, claims management, AIGC detection, verification, research logging, and CLI tools"

[features]
default = ["cli"]
cli = ["dep:clap"]
smoke = []

[dependencies]
# framework (leaf crates, no cycle risk)
core-state-utils = { path = "../core-state-utils" }
core-errors = { path = "../core-errors" }
framework-core = { path = "../framework-core" }
framework-runtime = { path = "../framework-runtime" }
core-state = { path = "../core-state" }
host-projection = { path = "../host-projection" }
quality-gate = { path = "../quality-gate" }

# common
anyhow.workspace = true
chrono.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yml.workspace = true
tracing.workspace = true
tokio.workspace = true
futures.workspace = true
regex.workspace = true
sha2.workspace = true
mcp-stdio-common = { path = "../../rust_tools/mcp-stdio-common" }
minilp.workspace = true

# CLI (optional)
clap = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "autoresearch"
path = "src/bin/autoresearch.rs"
required-features = ["cli"]

[[bin]]
name = "research-log"
path = "src/bin/research-log.rs"
required-features = ["cli"]

[[bin]]
name = "mcp-research-harness"
path = "src/bin/mcp-research-harness.rs"

[lints]
workspace = true
