[package]
name = "runtime-infra"
version = "0.1.0"
edition = "2024"
description = "L5 运行时基础设施 (env/path/time/io/sync/compute/bootstrap) — 实际依赖 L5 host-projection/runtime-exit-gate，从 L4 升级"
[lints]
workspace = true

[dependencies]
# B0
core-state = { path = "../core-state" }
core-state-utils = { path = "../core-state-utils" }
core-policy = { path = "../core-policy" }
framework-kernel = { path = "../framework-kernel" }

# L0/L1
host-projection = { path = "../host-projection" }
routing-engine = { path = "../routing-engine" }

# L4
fr-exec = { path = "../fr-exec" }
fr-utils = { path = "../fr-utils" }
runtime-exit-gate = { path = "../runtime-exit-gate" }
runtime-storage = { path = "../runtime-storage" }

# workspace
serde.workspace = true
serde_json.workspace = true
telem = { path = "../telemetry-emit", package = "telemetry-emit" }
tracing.workspace = true
which.workspace = true
