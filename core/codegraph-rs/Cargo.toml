[package]
name = "codegraph-rs"
version = "0.1.0"
edition = "2021"
description = "Code knowledge graph MCP server (Roadmap v5 B10)"

[lints]
workspace = true

[lib]
name = "codegraph_rs"
path = "src/lib.rs"

[[bin]]
name = "mcp-codegraph"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono = { workspace = true, features = ["clock", "std"] }
clap.workspace = true
notify.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tree-sitter = "0.24"
tree-sitter-go = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
rayon.workspace = true
sha2.workspace = true

[features]
default = []
codegraph = []
