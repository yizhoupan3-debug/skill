[package]
name = "codegraph-rs"
version = "0.1.0"
edition = "2021"
description = "Code knowledge graph MCP server (Roadmap v5 B10)"

[lib]
name = "codegraph_rs"
path = "src/lib.rs"

[[bin]]
name = "mcp-codegraph"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
notify = "7.0"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.24"
tree-sitter-go = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
rayon = "1.10"
sha2 = "0.11"

[features]
default = []
codegraph = []
