[package]
name = "framework-extra"
version = "0.1.0"
edition = "2024"
description = "L6 orchestration control plane: doctor, session_artifacts, snapshot"
[lints]
workspace = true

[features]
default = []
codegraph = ["dep:codegraph-rs"]
test-support = []

[dependencies]
# B0
core-state = { path = "../core-state" }
core-state-utils = { path = "../core-state-utils" }
core-policy = { path = "../core-policy" }
core-errors = { path = "../core-errors" }
framework-kernel = { path = "../framework-kernel" }

# L4
fr-utils = { path = "../fr-utils" }
fr-contracts = { path = "../fr-contracts" }
fr-exec = { path = "../fr-exec" }
trace-runtime = { path = "../trace-runtime" }
runtime-core-contracts = { path = "../runtime-core-contracts" }
runtime-storage = { path = "../runtime-storage" }
routing-engine = { path = "../routing-engine" }
host-projection = { path = "../host-projection" }
# L4 (runtime infrastructure)
runtime-infra = { path = "../runtime-infra" }

# B10 codegraph-rs (feature-gated)
codegraph-rs = { path = "../codegraph-rs", optional = true }

# workspace
chrono.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
