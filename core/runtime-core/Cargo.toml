[package]
name = "runtime-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "runtime_core"
path = "src/lib.rs"

[dependencies]
core-state = { path = "../core-state" }
core-policy = { path = "../core-policy" }
framework-kernel = { path = "../framework-kernel" }
routing-engine = { path = "../routing-engine" }
chrono = { version = "0.4", features = ["clock", "std", "serde"] }
fs2 = "0.4"
hex = "0.4"
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
