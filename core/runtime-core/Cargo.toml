[package]
name = "runtime-core"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lints]
workspace = true

[lib]
name = "runtime_core"
path = "src/lib.rs"

[dependencies]
core-state = { path = "../core-state" }
core-policy = { path = "../core-policy", features = ["dev-exempt", "test-sync"] }
framework-kernel = { path = "../framework-kernel" }
host-projection = { path = "../host-projection" }
routing-engine = { path = "../routing-engine" }
runtime-storage = { path = "../runtime-storage" }
session-supervisor = { path = "../session-supervisor" }
trace-runtime = { path = "../trace-runtime" }
chrono.workspace = true
clap.workspace = true
fs2.workspace = true
hex.workspace = true
libc.workspace = true
rayon.workspace = true
regex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tungstenite.workspace = true
tracing.workspace = true
which.workspace = true
ctor = "0.2"
codegraph-rs = { path = "../../tools/codegraph-rs", optional = true }
framework-runtime = { path = "../framework-runtime" }

[build-dependencies]
serde_json.workspace = true

[features]
default = [
    "host-cursor",
    "host-claude-code",
    "host-opencode",
    "host-codex",
    "host-mimo",
    "codegraph",
]
host-cursor = []
host-claude-code = []
host-opencode = []
host-codex = []
host-mimo = []
# Expose test helpers for downstream crate integration tests
test-support = ["host-projection/test-support"]
# Codegraph MCP integration (module lives in runtime-core; router-rs re-exports)
codegraph = ["dep:codegraph-rs"]

[dev-dependencies]
serial_test = "3"
