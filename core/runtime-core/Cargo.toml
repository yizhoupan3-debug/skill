[package]
name = "runtime-core"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lints]
workspace = true

[lib]
name = "runtime_core"
path = "src/lib.rs"

[dependencies]
core-state = { path = "../core-state" }
core-state-utils = { path = "../core-state-utils" }
core-policy = { path = "../core-policy", features = ["dev-exempt", "test-sync"] }
framework-extra = { path = "../framework-extra" }
framework-kernel = { path = "../framework-kernel" }
framework-runtime-hooks = { path = "../framework-runtime-hooks" }
framework-maint = { path = "../framework-maint" }
host-projection = { path = "../host-projection" }
fr-utils = { path = "../fr-utils" }
fr-contracts = { path = "../fr-contracts" }
fr-exec = { path = "../fr-exec" }
routing-engine = { path = "../routing-engine" }
runtime-core-contracts = { path = "../runtime-core-contracts" }
runtime-exit-gate = { path = "../runtime-exit-gate" }
runtime-infra = { path = "../runtime-infra" }
runtime-storage = { path = "../runtime-storage" }
session-supervisor = { path = "../session-supervisor" }
trace-runtime = { path = "../trace-runtime" }
chrono.workspace = true
clap.workspace = true
fs2.workspace = true
hex.workspace = true
libc.workspace = true
rayon.workspace = true
regex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tungstenite.workspace = true
tracing.workspace = true
which.workspace = true
ctor = "0.2"
codegraph-rs = { path = "../../tools/codegraph-rs", optional = true }
loop-engine = { path = "../loop-engine" }
mcp-tool-registry = { path = "../mcp-tool-registry" }

[build-dependencies]
serde_json.workspace = true

[features]
default = [
    "host-cursor",
    "host-claude",
    "host-opencode",
    "host-codex",
]
host-cursor = []
host-claude = []
host-opencode = []
host-codex = []
# Expose test helpers for downstream crate integration tests
test-support = ["host-projection/test-support", "runtime-core-contracts/test-support"]
# Codegraph MCP integration (module lives in runtime-core; router-rs re-exports)
codegraph = ["dep:codegraph-rs"]

[dev-dependencies]
insta.workspace = true
serial_test = "3"
tempfile.workspace = true
