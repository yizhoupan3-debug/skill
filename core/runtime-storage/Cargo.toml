[package]
name = "runtime-storage"
version = "0.1.0"
edition = "2024"
description = "L1 storage backends: filesystem, SQLite, in-memory, path resolution"
[lints]
workspace = true

[features]
default = ["l5-state"]
# L5 运行时状态持久化（background_state 作业 FSM、会话仲裁、收割）。关闭后仅保留 L4 存储原语。
l5-state = []

[lib]
name = "rt_storage"
path = "src/lib.rs"

[dependencies]
chrono = { workspace = true }
core-state-utils = { path = "../core-state-utils" }
framework-kernel = { path = "../framework-kernel" }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
fs2 = { workspace = true }
hex = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
core-policy = { path = "../core-policy", features = ["dev-exempt", "test-sync"] }
insta.workspace = true
serial_test = "3"
