[package]
name = "router-rs"
version = "0.1.0"
edition = "2024"
description = "L7 CLI binary: host hook dispatch and agent dispatch entry point"
autotests = false
default-run = "router-rs-cli"

[lints]
workspace = true

[lib]
name = "router_rs"
path = "src/lib.rs"

[dependencies]
core-state = { path = "../core-state" }
core-state-utils = { path = "../core-state-utils" }
routing-engine = { path = "../routing-engine" }
skill-layer = { path = "../skill-layer" }
runtime-core = { path = "../runtime-core", features = ["test-support"] }
host-projection = { path = "../host-projection" }
framework-extra = { path = "../framework-extra" }
core-errors = { path = "../core-errors" }
framework-core = { path = "../framework-core", features = ["dev-exempt", "test-sync"] }
framework-runtime = { path = "../framework-runtime" }
goal-engine = { path = "../goal-engine" }
observability-core = { path = "../observability-core" }
browser-mcp = { path = "../../tools/browser-mcp", optional = true }
mcp-tool-registry = { path = "../mcp-tool-registry" }
research-harness = { path = "../research-harness", optional = true }
libc.workspace = true
chrono.workspace = true
clap.workspace = true
regex.workspace = true
rayon.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
tungstenite.workspace = true
fs2.workspace = true
which.workspace = true
tracing.workspace = true
mimalloc.workspace = true

[[bin]]
name = "router-rs-cli"
path = "src/bin/router-rs-cli.rs"

[features]
default = [
    "browser",
    "host-cursor",
    "host-claude",
    "host-opencode",
    "host-codex",
    "research",
    "codegraph",
]
host-cursor = []
host-claude = []
host-opencode = []
host-codex = []
browser = ["dep:browser-mcp"]
codegraph = ["runtime-core/codegraph"]
research = ["dep:research-harness"]

[dev-dependencies]
serial_test = "3"
ctor = "0.2"
criterion = { version = "0.5", features = ["html_reports"] }
codegraph-rs = { path = "../codegraph-rs" }
tempfile = "3"
serde_json = "1"

