[package]
name = "router-rs"
version = "0.1.0"
edition = "2024"
autotests = false
default-run = "router-rs-cli"

[lints]
workspace = true

[lib]
name = "router_rs"
path = "src/lib.rs"

[dependencies]
core-state = { path = "../core-state" }
framework-kernel = { path = "../framework-kernel" }
core-policy = { path = "../core-policy", features = ["dev-exempt", "test-sync"] }
routing-engine = { path = "../routing-engine" }
runtime-core = { path = "../runtime-core", features = ["test-support"] }
host-projection = { path = "../host-projection" }
framework-extra = { path = "../framework-extra" }
loop-engine = { path = "../loop-engine" }
browser-mcp = { path = "../browser-mcp" }
research-harness = { path = "../research-harness", optional = true }
libc.workspace = true
chrono.workspace = true
clap.workspace = true
regex.workspace = true
rayon.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
tungstenite.workspace = true
fs2.workspace = true
which.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mimalloc.workspace = true

[[bin]]
name = "router-rs-cli"
path = "src/bin/router-rs-cli.rs"

[features]
default = [
    "host-cursor",
    "host-claude",
    "host-opencode",
    "host-codex",
    "research",
]
host-cursor = []
host-claude = []
host-opencode = []
host-codex = []
codegraph = ["runtime-core/codegraph"]
research = ["dep:research-harness"]

[dev-dependencies]
serial_test = "3"
ctor = "0.2"
criterion = { version = "0.5", features = ["html_reports"] }
codegraph-rs = { path = "../../tools/codegraph-rs" }
tempfile = "3"
serde_json = "1"

[[test]]
name = "smoke_codex_hook_install_tests"
path = "tests/smoke_codex_hook_install_tests.rs"

[[bench]]
name = "search_bench"
harness = false
