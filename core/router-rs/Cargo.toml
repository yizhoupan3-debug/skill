[package]
name = "router-rs"
version = "0.1.0"
edition = "2021"
autotests = false

[lib]
name = "router_rs"
path = "src/lib.rs"

[dependencies]
core-state = { path = "../core-state" }
framework-kernel = { path = "../framework-kernel" }
core-policy = { path = "../core-policy", features = ["dev-exempt", "test-sync"] }
core-math = { path = "../core-math" }
routing-engine = { path = "../routing-engine" }
runtime-core = { path = "../runtime-core", features = ["test-support"] }
libc = "0.2"
chrono.workspace = true
clap = { version = "4.5.38", features = ["derive"] }
regex = "1.11.1"
rayon = "1.10.0"
reqwest = { version = "0.12.15", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.11"
hex = "0.4"
tungstenite = "0.24.0"
fs2 = "0.4"
which = "8.0.0"

[features]
default = [
    "host-cursor",
    "host-claude-code",
    "host-opencode",
    "host-antigravity",
    "host-codex",
]
host-cursor = []
host-claude-code = []
host-opencode = []
host-antigravity = []
host-codex = []
codegraph = ["runtime-core/codegraph"]

[dev-dependencies]
serial_test = "3"
ctor = "0.2"
criterion = { version = "0.5", features = ["html_reports"] }
codegraph-rs = { path = "../codegraph-rs" }

[[bench]]
name = "search_bench"
harness = false
