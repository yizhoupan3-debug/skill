[package]
name = "router-rs"
version = "0.1.0"
edition = "2021"
autotests = false
default-run = "router-rs-cli"

[lib]
name = "router_rs"
path = "src/lib.rs"

[dependencies]
core-state = { path = "../core-state" }
framework-kernel = { path = "../framework-kernel" }
core-policy = { path = "../core-policy", features = ["dev-exempt", "test-sync"] }
routing-engine = { path = "../routing-engine" }
runtime-core = { path = "../runtime-core", features = ["test-support"] }
browser-mcp = { path = "../browser-mcp" }
libc.workspace = true
chrono.workspace = true
clap.workspace = true
regex.workspace = true
rayon.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
tungstenite.workspace = true
fs2.workspace = true
which.workspace = true
mimalloc.workspace = true

[[bin]]
name = "router-rs-cli"
path = "src/bin/router-rs-cli.rs"

[features]
default = [
    "host-cursor",
    "host-claude-code",
    "host-opencode",
    "host-codex",
    "codegraph",
]
host-cursor = []
host-claude-code = []
host-opencode = []
host-codex = []
codegraph = ["runtime-core/codegraph"]

[dev-dependencies]
serial_test = "3"
ctor = "0.2"
criterion = { version = "0.5", features = ["html_reports"] }
codegraph-rs = { path = "../codegraph-rs" }

[[bench]]
name = "search_bench"
harness = false
