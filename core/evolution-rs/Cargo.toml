[package]
name = "evolution-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "evolution_rs"
path = "src/lib.rs"

[[bin]]
name = "evolution-rs"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono.workspace = true
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
rayon = "1.5"
memmap2 = "0.5"
sha2 = "0.11"
hex = "0.4"
fs2 = "0.4"
