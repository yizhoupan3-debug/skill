[package]
name = "host-projection"
version = "0.1.0"
edition = "2024"
[lints]
workspace = true

[lib]
name = "host_projection"
path = "src/lib.rs"

[features]
default = []
test-support = []

[dependencies]
core-state = { path = "../core-state" }
core-policy = { path = "../core-policy" }
framework-kernel = { path = "../framework-kernel" }
routing-engine = { path = "../routing-engine" }
chrono.workspace = true
clap.workspace = true
fs2.workspace = true
libc.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
sha2.workspace = true
which.workspace = true

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
core-policy = { path = "../core-policy", features = ["dev-exempt", "test-sync"] }
serial_test = "3"
