[package]
name = "host-projection"
version = "0.1.0"
edition = "2024"
description = "L5 host projection: hook dispatch, MCP stdio bridge, provider trait"
[lints]
workspace = true

[lib]
name = "host_projection"
path = "src/lib.rs"

[features]
default = []
test-support = []

[dependencies]
unicode-normalization = "0.1"
core-state = { path = "../core-state" }
core-state-utils = { path = "../core-state-utils" }
chain-engine = { path = "../chain-engine" }
core-errors = { path = "../core-errors" }
framework-core = { path = "../framework-core" }
chrono.workspace = true
clap.workspace = true
fs2.workspace = true
libc.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
sha2.workspace = true
which.workspace = true
mcp-tool-registry = { path = "../mcp-tool-registry" }
routing-engine = { path = "../routing-engine" }
tool-routing-engine = { path = "../tool-routing-engine" }

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
framework-core = { path = "../framework-core", features = ["test-sync"] }
insta.workspace = true
serial_test = "3"
