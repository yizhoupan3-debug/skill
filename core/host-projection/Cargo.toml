[package]
name = "host-projection"
version = "0.1.0"
edition = "2021"

[lib]
name = "host_projection"
path = "src/lib.rs"

[features]
default = []
test-support = []

[dependencies]
core-state = { path = "../core-state" }
core-policy = { path = "../core-policy" }
framework-kernel = { path = "../framework-kernel" }
chrono = { version = "0.4", features = ["clock", "std", "serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
which = "8"

[build-dependencies]
serde_json = "1.0"

[dev-dependencies]
serial_test = "3"
