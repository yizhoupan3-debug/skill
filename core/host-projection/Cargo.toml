[package]
name = "host-projection"
version = "0.1.0"
edition = "2024"
description = "L5 host projection: hook dispatch, MCP stdio bridge, provider trait"
[lints]
workspace = true

[lib]
name = "host_projection"
path = "src/lib.rs"

[features]
default = []
test-support = []

[dependencies]
core-state-utils = { path = "../core-state-utils" }
core-state = { path = "../core-state" }
core-state-types = { path = "../core-state-types" }
core-policy = { path = "../core-policy" }
core-errors = { path = "../core-errors" }
framework-kernel = { path = "../framework-kernel" }
chrono.workspace = true
clap.workspace = true
fs2.workspace = true
libc.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
sha2.workspace = true
which.workspace = true
mcp-tool-registry = { path = "../mcp-tool-registry" }
tool-routing-engine = { path = "../tool-routing-engine" }

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
core-policy = { path = "../core-policy", features = ["dev-exempt", "test-sync"] }
insta.workspace = true
serial_test = "3"
