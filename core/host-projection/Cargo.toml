[package]
name = "host-projection"
version = "0.1.0"
edition = "2024"
[lints]
workspace = true

[lib]
name = "host_projection"
path = "src/lib.rs"

[features]
default = []
test-support = []
codegraph = ["dep:codegraph-rs"]

[dependencies]
codegraph-rs = { path = "../../tools/codegraph-rs", optional = true }
http-util = { path = "../http-util" }
core-state = { path = "../core-state" }
core-policy = { path = "../core-policy" }
framework-kernel = { path = "../framework-kernel" }
chrono.workspace = true
clap.workspace = true
fs2.workspace = true
libc.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
sha2.workspace = true
which.workspace = true

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
core-policy = { path = "../core-policy", features = ["dev-exempt", "test-sync"] }
insta.workspace = true
serial_test = "3"
