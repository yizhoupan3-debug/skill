[package]
name = "framework-runtime"
version = "0.1.0"
edition = "2024"
description = "L3 facade over fr-utils(L1), fr-contracts(L2), fr-exec(L3)"
[lints]
workspace = true

[lib]
name = "framework_runtime"
path = "src/lib.rs"

[dependencies]
fr-utils = { path = "../fr-utils" }
fr-contracts = { path = "../fr-contracts" }
fr-exec = { path = "../fr-exec" }
framework-kernel = { path = "../framework-kernel" }
framework-runtime-hooks = { path = "../framework-runtime-hooks" }
host-projection = { path = "../host-projection" }
http-util = { path = "../http-util" }
runtime-storage = { path = "../runtime-storage" }
trace-runtime = { path = "../trace-runtime" }
serde_json.workspace = true

[dev-dependencies]
insta.workspace = true
