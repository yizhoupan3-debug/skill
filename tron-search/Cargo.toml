[package]
name = "tron-search"
version = "0.1.0"
edition = "2024"
description = "Search for all occurrences of a TRON address on the blockchain via public APIs"

[lints]
workspace = true

[dependencies]
reqwest = { workspace = true, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
anyhow = "1"
