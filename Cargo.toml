[package]
name = "skill-rust-test-harness"
version = "0.1.0"
edition = "2024"

[dependencies]

[dev-dependencies]
serde_json.workspace = true
serde_yml.workspace = true
tempfile.workspace = true
regex.workspace = true
which.workspace = true
rusqlite.workspace = true

[workspace]
members = [
    "core/core-state",
    "core/framework-kernel",
    "core/telemetry-types",
    "core/core-policy",
    "core/routing-engine",
    "core/router-rs",
    "core/runtime-storage",
    "core/runtime-core",
    "core/runtime-core-contracts",
    "core/session-supervisor",
    "core/trace-runtime",
    "core/browser-mcp",
    "core/host-projection",
    "core/framework-runtime",
    "core/loop-engine",
    "core/research-harness",
    "core/tool-layer",
    "tools/evolution-rs",
    "tools/codegraph-rs",
    "tron-search"]
exclude = [
    "codex-aggregator"
]
resolver = "2"

[workspace.lints.rust]
unexpected_cfgs = "warn"

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
# --- 统一版本管理 (2026-06-09 技术债清理) ---
anyhow = "1.0"
thiserror = "2.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.5", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }

fs2 = "0.4"
hex = "0.4"
insta = { version = "1.42", features = ["json"] }
libc = "0.2"
mimalloc = "0.1"
notify = "7.0"

rayon = "1.10"
regex = "1.11.1"
reqwest = { version = "0.12.15", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "=0.0.12"
sha2 = "0.11"
tempfile = "3.15"
tokio = { version = "1.44", features = ["sync", "rt", "macros", "time"] }
mockall = "0.13"
tracing = "0.1"
tungstenite = "0.24"
uuid = "1.0"
which = "8"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
debug = true  # bench 需要 debug symbols 以生成 flamegraph

[profile.test]
opt-level = 1  # test 构建适度优化，加速大型测试
