[package]
name = "skill-rust-test-harness"
version = "0.1.0"
edition = "2024"
description = "Integration test harness for the framework runtime"

[dependencies]

[dev-dependencies]
routing-engine = { path = "core/routing-engine" }
framework-core = { path = "core/framework-core" }
runtime-core = { path = "core/runtime-core" }
serde_json.workspace = true
serde_yml.workspace = true
tempfile.workspace = true
regex.workspace = true
which.workspace = true
rusqlite.workspace = true

[workspace]
members = [
    "core/chain-engine",
    "core/core-errors",
    "core/core-state",
    "core/core-state-utils",
    "core/eval-route",
    "core/framework-runtime",
    "core/framework-core",
    "core/routing-engine",
    "core/router-rs",
    "core/runtime-storage",
    "core/runtime-core",
    "core/trace-runtime",
    "tools/browser-mcp",
    "core/host-projection",
    "core/framework-extra",
    "core/runtime-infra",
    "core/goal-engine",
    "core/observability-core",
    "core/research-harness",
    "core/framework-maint",
    "core/codegraph-rs",
    "core/mcp-tool-registry",
    "core/skill-layer",
    "core/routing-core",
    "core/tool-routing-engine",
    "core/http-util",
    "core/quality-gate",
    "core/session-supervisor",
    "rust_tools/batch-common",
    "rust_tools/citation_tool_rs",
    "rust_tools/financial_data_rs",
    "rust_tools/gh_source_gate_rs",
    "rust_tools/mcp-stdio-common",
    "rust_tools/ooxml_parser_rs",
    "rust_tools/pdf_tool_rs",
    "rust_tools/pptx_tool_rs",
    "core/caveman"]
resolver = "2"

[workspace.lints.rust]
unexpected_cfgs = "warn"

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
# --- 统一版本管理 (2026-06-09 技术债清理) ---
anyhow = "1.0"
thiserror = "2.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.5", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }

fs2 = "0.4"
futures = "0.3"
hex = "0.4"
insta = { version = "1.42", features = ["json"] }
libc = "0.2"
mimalloc = "0.1"
minilp = "0.2"
notify = "8.2"

rayon = "1.10"
regex = "1.11.1"
reqwest = { version = "0.12.15", default-features = false, features = ["blocking", "gzip", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
quick-xml = "0.36"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "=0.0.12"
sha2 = "0.11"
tempfile = "3.15"
tokio = { version = "1.44", features = ["sync", "rt", "macros", "time"] }
mockall = "0.13"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tungstenite = "0.24"
which = "8"
z3 = { version = "0.20", features = ["bundled"] }
z3-sys = { version = "0.11", features = ["bundled"] }

[profile.dev]
split-debuginfo = "unpacked"  # macOS 链接加速：DWARF 不进链接阶段

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
debug = true  # bench 需要 debug symbols 以生成 flamegraph

[profile.test]
opt-level = 1  # test 构建适度优化，加速大型测试

[profile.ci]
inherits = "release"
codegen-units = 16  # 并行代码生成，加速 CI
lto = "thin"        # ThinLTO 替代全量 LTO
