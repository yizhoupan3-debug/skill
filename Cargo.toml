[package]
name = "skill-rust-test-harness"
version = "0.1.0"
edition = "2021"

[dependencies]

[dev-dependencies]
which = "8"
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1.0"
serde_yml = "=0.0.12"
tempfile = "3.15"

[workspace]
members = [
    ".",
    "cli/antigravity-cli",
    "core/core-state",
    "core/framework-kernel",
    "core/core-policy",
    "core/core-math",
    "core/routing-engine",
    "core/router-rs",
    "core/router-rs-cli",
    "core/runtime-core",
    "core/browser-mcp",
    "core/host-projection",
    "core/autoresearch-rs",
    "core/evolution-rs",
    "core/codegraph-rs",
    "rust_tools/citation_tool_rs",
    "rust_tools/financial_data_rs",
    "rust_tools/gh_source_gate_rs",
    "rust_tools/image_gen_rs",
    "rust_tools/image_process_rs",
    "rust_tools/ooxml_parser_rs",
    "rust_tools/pdf_tool_rs",
    "rust_tools/ref_corpus_tool_rs",
    "rust_tools/pptx_tool_rs",
    "rust_tools/pubmed_tool_rs",
    "rust_tools/screenshot_rs"
]
exclude = [
    "codex-aggregator"
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
