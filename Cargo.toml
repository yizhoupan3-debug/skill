[package]
name = "skill-rust-test-harness"
version = "0.1.0"
edition = "2021"

[dependencies]

[dev-dependencies]
which.workspace = true
regex.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
serde_yml.workspace = true
tempfile.workspace = true

[workspace]
members = [
    ".",
    "core/core-state",
    "core/framework-kernel",
    "core/core-policy",
    "core/core-math",
    "core/routing-engine",
    "core/router-rs",
    "core/router-rs-cli",
    "core/runtime-core",
    "core/browser-mcp",
    "core/host-projection",
    "core/autoresearch-rs",
    "core/evolution-rs",
    "core/codegraph-rs",
    "rust_tools/citation_tool_rs",
    "rust_tools/financial_data_rs",
    "rust_tools/gh_source_gate_rs",
    "rust_tools/image_gen_rs",
    "rust_tools/image_process_rs",
    "rust_tools/ooxml_parser_rs",
    "rust_tools/pdf_tool_rs",
    "rust_tools/ref_corpus_tool_rs",
    "rust_tools/pptx_tool_rs",
    "rust_tools/pubmed_tool_rs",
    "rust_tools/screenshot_rs"
]
exclude = [
    "codex-aggregator"
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
# --- 统一版本管理 (2026-06-09 技术债清理) ---
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
hex = "0.4"
libc = "0.2"
mimalloc = "0.1"
notify = "7.0"
rayon = "1.10"
regex = "1.11.1"
reqwest = { version = "0.12.15", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "=0.0.12"
sha2 = "0.11"
tempfile = "3.15"
tokio = { version = "1.44", features = ["sync"] }
tungstenite = "0.24"
which = "8"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
