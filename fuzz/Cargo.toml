[package]
name = "skill-fuzz"
version = "0.1.0"
edition = "2024"
description = "Fuzz testing harness for framework components"
publish = false

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
host-projection = { path = "../core/host-projection", features = ["test-support"] }
core-state-utils = { path = "../core/core-state-utils" }
routing-engine = { path = "../core/routing-engine" }

[[bin]]
name = "mcp_stdio_parse"
path = "fuzz_targets/mcp_stdio_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stdio_json_line"
path = "fuzz_targets/stdio_json_line.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hook_stdin_parse"
path = "fuzz_targets/hook_stdin_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "routing_decision"
path = "fuzz_targets/routing_decision.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jsonl_maintenance"
path = "fuzz_targets/jsonl_maintenance.rs"
test = false
doc = false
bench = false
