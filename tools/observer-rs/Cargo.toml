[package]
name = "observer-rs"
version = "0.1.0"
edition = "2024"
description = "Telemetry observation & analysis tool"
[lints]
workspace = true

[lib]
name = "observer_rs"
path = "src/lib.rs"

[[bin]]
name = "observer-rs"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
telemetry-types = { path = "../../core/telemetry-types" }
toml = "0.8"
chrono.workspace = true
clap.workspace = true
anyhow.workspace = true
sha2.workspace = true
hex.workspace = true
fs2.workspace = true
tracing.workspace = true
