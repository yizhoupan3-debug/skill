schema_version = 1

[filters.framework-skills]
description = "Compact router-rs framework skills validate/refresh output"
match_command = "^cargo\\s+run\\b.*framework\\s+skills\\s+(validate|refresh)"
strip_ansi = true
strip_lines_matching = [
  "^\\s*Compiling\\s+",
  "^\\s*Finished\\s+",
  "^\\s*Running\\s+",
]
max_lines = 80
on_empty = "framework skills: ok"

[[tests.framework-skills]]
name = "strips cargo wrapper noise"
input = """
   Compiling router-rs v0.1.0 (/repo/core/router-rs)
    Finished `dev` profile [unoptimized + debuginfo] target(s) in 0.20s
     Running `core/router-rs/target/debug/router-rs framework skills validate`
framework skills validate: ok
"""
expected = "framework skills validate: ok"

[filters.cargo-build]
description = "Compact cargo build output"
match_command = "^cargo\\s+build"
strip_ansi = true
strip_lines_matching = [
  "^\\s*Compiling\\s+",
  "^\\s*Finished\\s+",
]
max_lines = 30
on_empty = "cargo build: ok"

[[tests.cargo-build]]
name = "strips compile noise"
input = """
   Compiling serde v1.0.0
   Compiling router-rs v0.1.0 (/repo/core/router-rs)
    Finished `dev` profile [unoptimized + debuginfo] target(s) in 1.23s
"""
expected = "cargo build: ok"

[filters.cargo-test]
description = "Compact cargo test output"
match_command = "^cargo\\s+test"
strip_ansi = true
strip_lines_matching = [
  "^\\s*Compiling\\s+",
  "^\\s*Finished\\s+",
  "^\\s*Running\\s+",
  "^test result: ok",
]
max_lines = 50
on_empty = "cargo test: ok"

[[tests.cargo-test]]
name = "strips compile and pass noise"
input = """
   Compiling router-rs v0.1.0 (/repo/core/router-rs)
    Finished `test` profile [unoptimized + debuginfo] target(s) in 2.10s
     Running unittests src/main.rs (target/debug/deps/router_rs-abc123)

running 42 tests
test result: ok. 42 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out
"""
expected = """

running 42 tests
"""

[filters.cargo-check]
description = "Compact cargo check output"
match_command = "^cargo\\s+check"
strip_ansi = true
strip_lines_matching = [
  "^\\s*Compiling\\s+",
  "^\\s*Finished\\s+",
]
max_lines = 30
on_empty = "cargo check: ok"

[[tests.cargo-check]]
name = "strips compile noise"
input = """
   Compiling router-rs v0.1.0 (/repo/core/router-rs)
    Finished `dev` profile [unoptimized + debuginfo] target(s) in 0.95s
"""
expected = "cargo check: ok"

[filters.npm-test]
description = "Compact npm test output"
match_command = "^npm\\s+test"
strip_ansi = true
strip_lines_matching = [
  "^\\s*>\\s+",
  "^\\s*\\d+\\s+passing",
  "^\\s*Test Suites:",
  "^\\s*Ran all test suites",
  "^\\s*Tests:",
]
max_lines = 40
on_empty = "npm test: ok"

[[tests.npm-test]]
name = "strips passing noise"
input = """
> project@1.0.0 test
> jest

 PASS  src/app.test.ts
  App
    ✓ renders (12 ms)

Test Suites: 1 passed, 1 total
Tests:       1 passed, 1 total
Ran all test suites.
"""
expected = """

 PASS  src/app.test.ts
  App
    ✓ renders (12 ms)
"""

[filters.pytest]
description = "Compact pytest output"
match_command = "^pytest\\s+"
strip_ansi = true
strip_lines_matching = [
  "^\\s*collected\\s+",
  "^\\s*=====.*=====.*=====$",
  "^\\s*short test summary info",
]
max_lines = 50
on_empty = "pytest: ok"

[[tests.pytest]]
name = "strips collected and separator"
input = """
============================= test session starts ==============================
collected 5 items

tests/test_main.py .....                                                [100%]

============================== 5 passed in 0.12s ==============================
"""
expected = """

tests/test_main.py .....                                                [100%]
"""

[filters.git-log]
description = "Compact git log output"
match_command = "^git\\s+log"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
]
max_lines = 20
on_empty = "git log: empty"

[[tests.git-log]]
name = "strips blank lines between commits"
input = """
commit abc1234
Author: Test <test@example.com>

    feat: add feature

"""
expected = """commit abc1234
Author: Test <test@example.com>
    feat: add feature"""

[filters.git-status]
description = "Compact git status output"
match_command = "^git\\s+status"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
]
max_lines = 30
on_empty = "git status: clean"

[[tests.git-status]]
name = "strips blank lines"
input = """
On branch main
Your branch is up to date with 'origin/main'.

nothing to commit, working tree clean
"""
expected = """On branch main
Your branch is up to date with 'origin/main'.
nothing to commit, working tree clean"""

[filters.git-diff]
description = "Compact git diff output"
match_command = "^git\\s+diff"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
]
max_lines = 50
on_empty = "git diff: no changes"

[[tests.git-diff]]
name = "preserves diff stat"
input = """
 core/router-rs/src/main.rs | 3 ++-
 1 file changed, 2 insertions(+), 1 deletion(-)
"""
expected = """ core/router-rs/src/main.rs | 3 ++-
 1 file changed, 2 insertions(+), 1 deletion(-)"""
