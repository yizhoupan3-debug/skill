[package]
name = "router-rs"
version = "0.1.0"
edition = "2021"
autotests = false

[lib]
name = "router_rs"
path = "src/lib.rs"

[[bin]]
name = "router-rs"
path = "src/main.rs"

[dependencies]
antigravity-core = { path = "../../core/antigravity" }
nix = { version = "0.28.0", features = ["signal", "process"] }
libc = "0.2"
chrono = { version = "0.4.40", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5.38", features = ["derive"] }
regex = "1.11.1"
rayon = "1.10.0"
reqwest = { version = "0.12.15", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
tungstenite = "0.24.0"
fs2 = "0.4"
which = "8.0.0"

