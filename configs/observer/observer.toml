# observer-rs 阈值真源
# CLI: observer-rs audit --config configs/observer/observer.toml
# Online observer (TelemetryObserver) also uses low_confidence_threshold from here.

[observer]
audit_window_days = 30
min_candidate_frequency = 2

[thresholds]
jaccard_near_match = 0.25
low_confidence_threshold = 0.45
healthy_score = 85.0
stable_score = 60.0
default_static_score = 85.0
boundary_collision_min_overlap = 4
min_correlation_count = 2
min_usage_for_pruning_hint = 6
min_word_length = 4

[weights]
dynamic_blend = 0.6
static_blend = 0.4

[audit]
top_ngram_candidates = 10

# Online observer thresholds (TelemetryObserver in framework-runtime)
# `telemetry_observer.rs` was deleted in Wave 2d — these defaults live in the Rust code.
[observer.online]
window_capacity = 256
reroute_rate_alert = 0.35
tool_failure_rate_alert = 0.25
