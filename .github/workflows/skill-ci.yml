name: Skill CI

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'core/**'
      - 'rust_tools/**'
      - 'tests/**'
      - '.claude/**'
      - '.cursor/**'
      - '.github/workflows/**'
      - 'AGENTS.md'
      - '.codex/**'
      - 'configs/codex/**'
      - 'configs/framework/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'core/**'
      - 'rust_tools/**'
      - 'tests/**'
      - '.claude/**'
      - '.cursor/**'
      - '.github/workflows/**'
      - 'AGENTS.md'
      - '.codex/**'
      - 'configs/codex/**'
      - 'configs/framework/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Skills must not teach operator pip
        run: bash scripts/ci/check-skills-no-operator-pip.sh

      - name: Cursor bootstrap + workspace hooks template sanity
        run: |
          bash -n scripts/cursor-bootstrap-framework.sh
          bash -n configs/framework/cursor-router-rs-hook.sh
          bash -n configs/framework/claude-router-rs-hook.sh
          uv run python -m json.tool configs/framework/cursor-hooks.workspace-template.json > /dev/null

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: /tmp/skill-cargo-target

      - name: Build router-rs
        run: cargo build --release --manifest-path core/router-rs/Cargo.toml

      - name: cargo deny check
        run: |
          cargo install cargo-deny --locked
          cargo deny check

      - name: Build antigravity crates
        run: |
          cargo build --release --manifest-path core/core-state/Cargo.toml

      - name: Schema drift contract smoke
        run: cargo run --quiet --manifest-path core/router-rs/Cargo.toml -- schema-drift contract

      - name: Cursor hooks 7-event parity (hooks.json vs workspace template)
        run: bash scripts/ci/check-cursor-hooks-parity.sh

      - name: Validate skill registry
        run: |
          cargo run --quiet --manifest-path core/router-rs/Cargo.toml -- framework skills validate --framework-root "$PWD"

      - name: Run Rust policy tests
        run: cargo test --test policy_contracts
      - name: policy registry review gate
        run: cargo test --test policy_registry_review_gate

      - name: Run Cursor rules link policy tests
        run: cargo test --test policy_cursor_rules_links

      - name: Run host integration tests
        run: cargo test --test host_integration

      - name: Run browser MCP integration tests
        run: cargo test --test browser_mcp_scripts

      - name: Run Rust CLI tools integration tests
        run: cargo test --test rust_cli_tools

      - name: Run antigravity crate tests
        run: cargo test --manifest-path core/core-state/Cargo.toml

      - name: Run router-rs crate tests
        run: cargo test --manifest-path core/router-rs/Cargo.toml

      - name: Routing regression gate (route_accuracy >= 0.95)
        run: bash scripts/ci/check-routing-regression.sh

      - name: Verify Cursor hooks wiring
        run: cargo run --manifest-path core/router-rs/Cargo.toml -- framework maint verify-cursor-hooks

      - name: Run Codex hook installer tests
        run: uv run python .cursor/hook-tests/test_install_codex_cli_hooks.py

      - name: Check generated artifact drift
        run: |
          cargo run --quiet --manifest-path core/router-rs/Cargo.toml -- framework skills refresh --framework-root "$PWD" --write
          cargo run --quiet --manifest-path core/router-rs/Cargo.toml -- \
            framework host-integration generated-artifacts-status \
            --framework-root "$PWD" > generated-artifacts-status.json
          uv run python - <<'PY'
          import json
          import sys

          with open("generated-artifacts-status.json", "r", encoding="utf-8") as handle:
              status = json.load(handle)
          if not status.get("ok"):
              print(json.dumps(status.get("manifest_status", {}), ensure_ascii=False, indent=2))
              for artifact in status.get("generated_artifacts", []):
                  if artifact.get("clean") is False or artifact.get("drifted") is True:
                      print(json.dumps(artifact, ensure_ascii=False, indent=2))
              sys.exit(1)
          print("generated-artifacts-status: ok")
          PY

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy workspace (default features)
        run: cargo clippy --workspace -- -D warnings

      - name: Clippy workspace (no default features)
        run: cargo clippy --workspace --no-default-features -- -D warnings

  feature-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        features:
          - "default"
          - "codegraph"
          - "host-cursor"
          - "host-claude-code"
          - "host-codex"
          - "host-opencode"
          - "host-antigravity"
          - "no-default-features"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: "Test with features: ${{ matrix.features }}"
        run: |
          if [ "${{ matrix.features }}" = "default" ]; then
            cargo test --workspace
          elif [ "${{ matrix.features }}" = "no-default-features" ]; then
            cargo test --workspace --no-default-features
          else
            cargo test --workspace --no-default-features --features "${{ matrix.features }}"
          fi

  full-workspace-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Full workspace test
        run: cargo test --workspace 2>&1 | tail -50

      - name: Verify zero test failures
        run: |
          result=$(cargo test --workspace 2>&1)
          echo "$result" | tail -5
          if echo "$result" | grep -q "0 failed"; then
            echo "✅ No test failures"
          else
            echo "❌ Test failures detected"
            exit 1
          fi

  cross-platform:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: /tmp/skill-cargo-target

      - name: Build workspace
        run: cargo build --workspace

      - name: Run antigravity crate tests
        run: cargo test --manifest-path core/core-state/Cargo.toml

      - name: Run router-rs crate tests
        run: cargo test --manifest-path core/router-rs/Cargo.toml

      - name: Run Rust policy tests
        run: cargo test --test policy_contracts

      - name: Routing regression gate (route_accuracy >= 0.95)
        run: bash scripts/ci/check-routing-regression.sh

  # ── Miri memory safety check (pure-logic crates only) ──
  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Run miri on pure-logic crates
        run: |
          cargo +nightly miri test --lib -p core-state -p framework-kernel -p core-policy

  # ── Code coverage ──
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info
