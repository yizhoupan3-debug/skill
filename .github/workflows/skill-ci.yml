name: Skill CI

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'core/**'
      - 'rust_tools/**'
      - 'tools/**'
      - 'tests/**'
      - '.claude/**'
      - '.cursor/**'
      - '.github/workflows/**'
      - 'fuzz/**'
      - 'AGENTS.md'
      - '.codex/**'
      - 'configs/framework/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'core/**'
      - 'rust_tools/**'
      - 'tools/**'
      - 'tests/**'
      - '.claude/**'
      - '.cursor/**'
      - '.github/workflows/**'
      - 'fuzz/**'
      - 'AGENTS.md'
      - '.codex/**'
      - 'configs/framework/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Enable sccache + mold
        uses: mozilla/sccache-action@v0.0.8
        with:
          version: "latest"

      - name: Install mold linker
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mold clang
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=clang" >> $GITHUB_ENV
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> $GITHUB_ENV

      - name: Skills must not teach operator pip
        run: bash scripts/ci/check-skills-no-operator-pip.sh

      - name: Cursor bootstrap + workspace hooks template sanity
        run: |
          bash -n scripts/cursor-bootstrap-framework.sh
          bash -n configs/framework/cursor-router-rs-hook.sh
          bash -n configs/framework/claude-router-rs-hook.sh
          uv run python -m json.tool configs/framework/cursor-hooks.workspace-template.json > /dev/null

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: /tmp/skill-cargo-target

      - name: Build router-rs
        run: cargo build --release --manifest-path core/router-rs/Cargo.toml

      - name: cargo deny check
        run: |
          cargo install cargo-deny --locked
          cargo deny check

      - name: Build core-state crate
        run: |
          cargo build --release --manifest-path core/core-state/Cargo.toml

      - name: Schema drift contract smoke
        run: cargo run --quiet --manifest-path core/router-rs/Cargo.toml -- schema-drift contract

      - name: Cursor hooks 7-event parity (hooks.json vs workspace template)
        run: bash scripts/ci/check-cursor-hooks-parity.sh

      - name: Validate skill registry
        run: |
          cargo run --quiet --manifest-path core/router-rs/Cargo.toml -- framework skills validate --framework-root "$PWD"

      - name: Run Rust policy tests
        run: cargo test --test policy_contracts
      - name: policy registry review gate
        run: cargo test --test policy_registry_review_gate

      - name: Run Cursor rules link policy tests
        run: cargo test --test policy_cursor_rules_links

      - name: Run host integration tests
        run: cargo test --test host_integration

      - name: Run browser MCP integration tests
        run: cargo test --test browser_mcp_scripts

      - name: Run Rust CLI tools integration tests
        run: cargo test --test rust_cli_tools

      - name: Run core-state crate tests
        run: cargo test --manifest-path core/core-state/Cargo.toml

      - name: Run router-rs crate tests
        run: cargo test --manifest-path core/router-rs/Cargo.toml

      - name: Routing regression gate (route_accuracy >= 0.95)
        run: bash scripts/ci/check-routing-regression.sh

      - name: Verify Cursor hooks wiring
        run: cargo run --manifest-path core/router-rs/Cargo.toml -- framework maint verify-cursor-hooks

      - name: Run Codex hook installer tests
        run: cargo test --manifest-path core/router-rs/Cargo.toml smoke_codex_hook_install -- --test-threads=1

      - name: Check generated artifact drift
        run: |
          cargo run --quiet --manifest-path core/router-rs/Cargo.toml -- framework skills refresh --framework-root "$PWD" --write
          cargo run --quiet --manifest-path core/router-rs/Cargo.toml -- \
            framework host-integration generated-artifacts-status \
            --framework-root "$PWD" > generated-artifacts-status.json
          uv run python - <<'PY'
          import json
          import sys

          with open("generated-artifacts-status.json", "r", encoding="utf-8") as handle:
              status = json.load(handle)
          if not status.get("ok"):
              print(json.dumps(status.get("manifest_status", {}), ensure_ascii=False, indent=2))
              for artifact in status.get("generated_artifacts", []):
                  if artifact.get("clean") is False or artifact.get("drifted") is True:
                      print(json.dumps(artifact, ensure_ascii=False, indent=2))
              sys.exit(1)
          print("generated-artifacts-status: ok")
          PY

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy workspace (default features)
        run: cargo clippy --workspace -- -D warnings

      - name: Clippy workspace (no default features)
        run: cargo clippy --workspace --no-default-features -- -D warnings

      - name: Clippy core-state lint (deny unwrap_used)
        run: cargo clippy -p core-state -p core-state-types -p core-state-utils -- -D warnings -D clippy::unwrap_used -D clippy::expect_used

      - name: Workspace compile check
        run: cargo test --workspace --no-run 2>&1 | tail -5

  feature-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        features:
          - "default"
          - "codegraph"
          - "host-cursor"
          - "host-claude"
          - "host-codex"
          - "host-opencode"
          - "no-default-features"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: "Test with features: ${{ matrix.features }}"
        run: |
          if [ "${{ matrix.features }}" = "default" ]; then
            cargo test --workspace
          elif [ "${{ matrix.features }}" = "no-default-features" ]; then
            cargo test --workspace --no-default-features
          else
            cargo test --workspace --no-default-features --features "${{ matrix.features }}"
          fi

  full-workspace-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Full workspace test
        run: cargo test --workspace 2>&1 | tail -50

      - name: Verify zero test failures
        run: |
          result=$(cargo test --workspace 2>&1)
          echo "$result" | tail -5
          if echo "$result" | grep -q "0 failed"; then
            echo "✅ No test failures"
          else
            echo "❌ Test failures detected"
            exit 1
          fi

  cross-platform:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: /tmp/skill-cargo-target

      - name: Build workspace
        run: cargo build --workspace

      - name: Run core-state crate tests
        run: cargo test --manifest-path core/core-state/Cargo.toml

      - name: Run router-rs crate tests
        run: cargo test --manifest-path core/router-rs/Cargo.toml

      - name: Run Rust policy tests
        run: cargo test --test policy_contracts

      - name: Routing regression gate (route_accuracy >= 0.95)
        run: bash scripts/ci/check-routing-regression.sh

  # ── Miri memory safety check (pure-logic crates only) ──
  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Run miri on pure-logic crates
        run: |
          cargo +nightly miri test --lib -p core-state -p framework-kernel -p core-policy

  # ── Code coverage ──
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Check coverage threshold (≥60%)
        run: |
          if command -v lcov &>/dev/null; then
            LINES_TOTAL=$(lcov --summary lcov.info 2>&1 | grep 'lines......' | awk '{print $2}' | tr -d '%')
            echo "Line coverage: ${LINES_TOTAL}%"
            if (( $(echo "$LINES_TOTAL < 60" | bc -l) )); then
              echo "❌ Coverage ${LINES_TOTAL}% < 60% threshold"
              exit 1
            fi
            echo "✅ Coverage ${LINES_TOTAL}% meets ≥60% threshold"
          else
            # Fallback: parse lcov.info directly
            LF=$(grep '^LF:' lcov.info | awk -F: '{s+=$2} END {print s}')
            LH=$(grep '^LH:' lcov.info | awk -F: '{s+=$2} END {print s}')
            if [ -n "$LF" ] && [ "$LF" -gt 0 ]; then
              PERCENT=$(echo "scale=1; $LH * 100 / $LF" | bc)
              echo "Line coverage: ${PERCENT}%"
              if (( $(echo "$PERCENT < 60" | bc -l) )); then
                echo "❌ Coverage ${PERCENT}% < 60% threshold"
                exit 1
              fi
              echo "✅ Coverage ${PERCENT}% meets ≥60% threshold"
            fi
          fi
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info

  # ── Fuzz smoke test (short runs, nightly-only) ──
  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz smoke - MCP stdio parse
        run: cargo +nightly fuzz run --fuzz-dir fuzz mcp_stdio_parse -- -max_len=512 -runs=500
      - name: Fuzz smoke - Stdio JSON line
        run: cargo +nightly fuzz run --fuzz-dir fuzz stdio_json_line -- -max_len=512 -runs=500
      - name: Fuzz smoke - Hook stdin parse
        run: cargo +nightly fuzz run --fuzz-dir fuzz hook_stdin_parse -- -max_len=512 -runs=500
      - name: Fuzz smoke - Routing decision
        run: cargo +nightly fuzz run --fuzz-dir fuzz routing_decision -- -max_len=512 -runs=500
      - name: Fuzz smoke - JSONL maintenance
        run: cargo +nightly fuzz run --fuzz-dir fuzz jsonl_maintenance -- -max_len=512 -runs=500

  # ── Build timing profile (non-blocking, produce HTML artifact) ──
  timings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: /tmp/skill-cargo-target
      - name: Enable sccache + mold
        uses: mozilla/sccache-action@v0.0.8
        with:
          version: "latest"
      - name: Install mold linker
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mold clang
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=clang" >> $GITHUB_ENV
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> $GITHUB_ENV
      - name: Build with timings (ci profile)
        run: cargo build --workspace --profile ci --timings 2>&1 | tail -10
      - name: Upload cargo timing report
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings
          path: target/cargo-timings/
