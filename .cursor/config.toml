#:schema https://developers.openai.com/cursor/config-schema.json

# Repo-local Cursor overlay for this repository.
# Keep only repository-scoped settings here.
# Machine-wide defaults belong in ~/.cursor/config.toml.

[features]
cursor_hooks = true

[mcpServers.mcp-codegraph]
command = "cargo"
args = ["run", "--release", "--quiet", "-p", "codegraph-rs", "--bin", "mcp-codegraph", "--manifest-path", "/Users/joe/Developer/skill/Cargo.toml", "--", "--repo-root", "/Users/joe/Developer/skill"]
