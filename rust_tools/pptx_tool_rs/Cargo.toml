[package]
name = "pptx_tool_rs"
version = "0.1.0"
edition = "2024"
description = "MCP PowerPoint (pptx) processing tool"
default-run = "ppt"

[lib]
name = "pptx_tool_rs"
path = "src/lib.rs"

[[bin]]
name = "ppt"
path = "src/bin/ppt.rs"

[[bin]]
name = "mcp-pptx"
path = "src/mcp_main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
font8x8 = "0.3"
image = "0.25"
mcp-stdio-common = { path = "../mcp-stdio-common" }
regex = "1.11"
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.15"
zip = "2.2"
