[package]
name = "ooxml_parser_rs"
version = "0.1.0"
edition = "2021"
default-run = "ooxml"

[lib]
name = "ooxml_parser_rs"
path = "src/lib.rs"

[[bin]]
name = "ooxml"
path = "src/main.rs"

[[bin]]
name = "mcp-ooxml"
path = "src/mcp_main.rs"

[dependencies]
anyhow = "1.0"
batch-common = { path = "../batch-common" }
calamine = "0.26"
clap = { version = "4.4", features = ["derive"] }
mcp-stdio-common = { path = "../mcp-stdio-common" }
quick-xml = "0.31"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.15"
zip = "2"
