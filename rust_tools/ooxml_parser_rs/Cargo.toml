[package]
name = "ooxml_parser_rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ooxml"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
quick-xml = "0.31"
zip = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tempfile = "3.15"
calamine = "0.26"
rayon = "1.10"
sha2 = "0.10"
hex = "0.4"
