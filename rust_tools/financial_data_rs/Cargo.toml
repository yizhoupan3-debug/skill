[package]
name = "financial_data_rs"
version = "0.1.0"
edition = "2024"
description = "MCP financial data retrieval tool"
default-run = "financial-data"

[lib]
name = "financial_data_rs"
path = "src/lib.rs"

[[bin]]
name = "financial-data"
path = "src/main.rs"

[[bin]]
name = "mcp-financial-data"
path = "src/mcp_main.rs"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
futures = "0.3"
mcp-stdio-common = { path = "../mcp-stdio-common" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["fs", "macros", "rt-multi-thread", "time"] }
