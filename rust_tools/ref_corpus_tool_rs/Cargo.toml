[package]
name = "ref_corpus_tool_rs"
version = "0.1.0"
edition = "2021"
description = "Local PDF ref corpus index + FTS search (Paper RAG harness)"

[[bin]]
name = "ref-corpus"
path = "src/main.rs"

[lib]
name = "ref_corpus_tool_rs"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
pdf_tool_rs = { path = "../pdf_tool_rs" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.15"
